aid: angitia-biopharmaceuticals
name: Angitia Biopharmaceuticals
description: 'Angitia Biopharmaceuticals is a clinical-stage biopharmaceutical company
  founded in 2018, headquartered at 3027 Townsgate Road, Westlake Village, California,
  with research and development operations in Guangzhou, China. It discovers and develops
  biologic therapeutics for serious musculoskeletal diseases, including osteoporosis,
  osteogenesis imperfecta, bone metastasis, osteoarthritis and muscle disorders. Its
  clinical pipeline is led by AGA2118 and AGA2115, bispecific antibodies targeting
  sclerostin and DKK1, alongside AGA111 in lumbar interbody fusion. The company closed
  a $120 million Series C financing in December 2024 led by Bain Capital Life Sciences.
  Angitia is a drug developer, not a software vendor: it publishes no API, developer
  portal, SDK, machine-readable specification, or technology platform of any kind.
  Its only machine-readable public surface is an XML sitemap and a robots.txt carrying
  Cloudflare-managed Content-Signal directives that reserve AI training rights.'
